    <style>
     html, body, a, button, input, [role="button"] {
    cursor: none !important;
  }

  #custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 48px;  
    height: 48px; 
    pointer-events: none; 
    transform: translate3d(var(--x, -100px), var(--y, -100px), 0);
    will-change: transform;
    z-index: 99999;
    background-image: url('custom-cursor.png'); 
    background-size: contain;
    background-repeat: no-repeat;
    transition: width 0.2s ease, height 0.2s ease, transform 0.05s ease-out;
  }

  #custom-cursor.hovering {
    width: 64px;  
    height: 64px; 
  }
       #loader {
            position: fixed;
            inset: 0;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            animation: loaderDisappear 1s ease-in 2.5s forwards;
        }
        #loader img {
            width: 180px;
            height: auto;

            opacity: 0;

            animation: logoAppear 1s ease-out forwards;
        }

        @keyframes logoAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
   @keyframes loaderDisappear {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }

        }
        body {
            background-image: linear-gradient(135deg, #000000 0%, #050D14 45%, #1E4D6B 100%);
         background-attachment: fixed;
         min-height: 100vh;
          cursor: url('custom-cursor.png') 12.5 12.5, auto; 
        }

a, button {
cursor: url('custom-cursor.png') 12.5 12.5, pointer;
}
     
     .logo{
     width: 10%;
      margin: auto;
      text-align: center;
     }
     .logo img{
      width: 100%;
       height: auto;
     }
     
       .get-started {
    background: linear-gradient(135deg, #FF3030, #FF7A00);
    color: white;
    border: none;
    border-radius: 30px;

    padding: 14px 32px;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    /* Glow / shadow */
    box-shadow: 0 0 15px rgba(255, 80, 30, 0.5);

    /* Entrance animation */
    opacity: 0;
    animation: buttonAppear 0.25s ease forwards;
    animation-delay: 0.25s;

    /* Smooth hover transition */
    transition: all 0.3s ease;
}

.get-started:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(255, 80, 30, 0.8);
}

/* Button entrance animation */
@keyframes buttonAppear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile */
@media (max-width: 600px) {
    .get-started {
        padding: 12px 25px;
        font-size: 16px;
    }
}
     .talk-to-us{
      display: inline-block;

  gap: 25px;

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
 <script>
  const cursor = document.getElementById('custom-cursor');

  window.addEventListener('mousemove', (e) => {
    const x = e.clientX - (cursor.offsetWidth / 2);
    const y = e.clientY - (cursor.offsetHeight / 2);
    
    cursor.style.setProperty('--x', `${x}px`);
    cursor.style.setProperty('--y', `${y}px`);
  });

  document.querySelectorAll('a, button, [role="button"]').forEach((element) => {
    element.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
    element.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
  });
</script>
