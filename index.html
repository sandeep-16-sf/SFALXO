       .get-started {
    background: linear-gradient(135deg, #FF3030, #FF7A00);
    color: white;
    border: none;
    border-radius: 30px;

    padding: 14px 32px;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 0 15px rgba(255, 80, 30, 0.5);

    transition: all 0.3s ease;
}

.get-started:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(255, 80, 30, 0.8);
 
 opacity: 0;
    animation: buttonAppear 0.25s ease forwards;
    animation-delay: 0.25s;
}
@keyframes buttonAppear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
}
      to {
        opacity: 1;
        transform: translateY(0);
    }
     
@media (max-width: 600px) {
    .get-started {
        padding: 12px 25px;
        font-size: 16px;
    }
}
    </style>
