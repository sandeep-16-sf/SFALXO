       #loader {
            position: fixed;
            inset: 0;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            animation: loaderDisappear 1s ease-in 2.5s forwards;
        }
        #loader img {
            width: 180px;
            height: auto;

            opacity: 0;

            animation: logoAppear 1s ease-out forwards;
        }

        @keyframes logoAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
   @keyframes loaderDisappear {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }

        }
