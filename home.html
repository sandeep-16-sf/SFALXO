<html>
  
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta charset="UTF-8">
     <link rel="icon" href="SFALXO.png" type="image/png">
    <title>home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <style>
       #loader {
            position: fixed;
            inset: 0;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            animation: loaderDisappear 1s ease-in 2.5s forwards;
        }
        #loader img {
            width: 180px;
            height: auto;

            opacity: 0;

            animation: logoAppear 1s ease-out forwards;
        }

        @keyframes logoAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
   @keyframes loaderDisappear {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }

        }
      body {
            min-height: 100vh;
    background: linear-gradient(
        to bottom,
        #FF3030 0%,
        #C00000 1.5%,
        #4A0000 5%,
        #120000 12%,
        #000000 25%,
        #000000 75%,
        #120000 88%,
        #4A0000 95%,
        #C00000 98.5%,
        #FF3030 100%
    );
        background-attachment: fixed;
       color: white;
      }
      .home-index{
        text-align: center;
      }
    
.p1 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    width: 100%;
    box-sizing: border-box;
}

.p1 a {
    display: block;
    min-width: 0;
}

.p1 img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
}

/* Tablet: 2 tiles */
@media (min-width: 577px) and (max-width: 991px) {
    .p1 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

/* Mobile: EXACTLY 1 tile */
@media (max-width: 576px) {
    .p1 {
        display: grid !important;
        grid-template-columns: minmax(0, 1fr) !important;
        gap: 15px;
        width: 100%;
    }

    .p1 > a {
        width: 100%;
        max-width: 100%;
    }

    .p1 > a > img {
        width: 100%;
        height: auto;
    }
}

      </style> 
  </head>
  
  <body link="red" alink="orange" vlink="red">
  <div id="loader">
        <img src="home-top-logo.png" alt="SFALXO">
    </div>
    <div class="home-index">

      </a>
    </div>

</div>

</html>
