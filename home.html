    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

    <style>
       #loader {
            position: fixed;
            inset: 0;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            animation: loaderDisappear 1s ease-in 2.5s forwards;
        }
        #loader img {
            width: 180px;
            height: auto;

            opacity: 0;

            animation: logoAppear 1s ease-out forwards;
        }

        @keyframes logoAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
   @keyframes loaderDisappear {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }

        }
      body {
            min-height: 100vh;
    background: linear-gradient(
        to bottom,
        #180000 0%,
        #080000 8%,
        #000000 25%,
        #000000 75%,
        #080000 92%,
        #180000 100%
    );
        background-attachment: fixed;
       color: white;
      }
       .image{
        display: flex;
        justify-content: center;
        width: 100%;
        text-align: center;
      }
      .image img{
        width: 15%;
        height: auto;
      }
      .notes{
        text-align: center;
        width: 40%;
        margin: auto;  
      }
.notes img {
    width: 100%;
    height: auto;
   border-radius: 30px;
}

      </style>
