<html>
  
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta charset="UTF-8">
     <link rel="icon" href="SFALXO.png" type="image/png">
    <title>home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <style>
       #loader {
            position: fixed;
            inset: 0;

            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;

            animation: loaderDisappear 1s ease-in 2.5s forwards;
        }
        #loader img {
            width: 180px;
            height: auto;

            opacity: 0;

            animation: logoAppear 1s ease-out forwards;
        }

        @keyframes logoAppear {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
   @keyframes loaderDisappear {

            from {
                opacity: 1;
            }

            to {
                opacity: 0;
                visibility: hidden;
            }

        }
      body {
background-image: linear-gradient(135deg, #ffffff 0%, #fbeeed 50%, #fca5a5 100%);

         background-attachment: fixed;
         min-height: 100vh;
          cursor: url('custom-cursor.png') 12.5 12.5, auto; 
         transition: background-color 0.3s, color 0.3s;

           color: #000000;
        }
     body.dark-theme {
background-image: linear-gradient(135deg, #000000 0%, #050D14 45%, #1E6B52 100%);

       background-attachment: fixed;
         color: #ffffff
}
      .theme{
      text-align: right;
     }
      #themeButton{
 text-align: right;
    background: #854D0E;
    color: white;
    border: none;
    border-radius: 30px;

    padding: 14px 32px;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    /* Glow / shadow */
    box-shadow: 0 0 15px rgba(255, 80, 30, 0.5);

    /* Entrance animation */
    opacity: 0;
    animation: buttonAppear 0.25s ease forwards;
    animation-delay: 0.25s;

    /* Smooth hover transition */
    transition: all 0.3s ease;
}

.get-started:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px rgba(255, 80, 30, 0.8);
}

/* Button entrance animation */
@keyframes buttonAppear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Mobile */
@media (max-width: 600px) {
    .get-started {
        padding: 12px 25px;
        font-size: 16px;
    }
}
      .home-index{
        text-align: center;
      }
    

/* Desktop: 3 tiles */
.p1 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

/* Links */
.p1 a {
    display: block;
    min-width: 0;
}

/* Images */
.p1 img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
}

/* Tablet: 2 tiles + side margins */
@media (min-width: 577px) and (max-width: 991px) {
    .p1 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin-left: 15px;
        margin-right: 15px;
    }
}

/* Mobile: 1 tile + side margins */
@media (max-width: 576px) {
    .p1 {
        grid-template-columns: minmax(0, 1fr) !important;
        margin-left: 12px;
        margin-right: 12px;
        gap: 12px;
    }
}

 
      </style> 
  </head>
  
  <body link="red" alink="orange" vlink="red">
  <div id="loader">
        <img src="home-top-logo.png" alt="SFALXO">
    </div>
     <div class="theme">
<button title="toggle theme" id="themeButton">Toggle THEME</button>
 </div>
    <div class="home-index">
      <a class="image" href="index.html">
      <img class="home-index" width="250" height="100" src="home-top-logo.png" alt="SFALXO">
      </a>
    </div>
    <br><br><br><br><br><br>


<div class="p1">




      <a href="notes-class.html">
        <img src="tools.jpg" alt="TOOLS" width="360" height="202">
      </a>


      <a href="notes-class.html">
        <img src="notes.jpg" alt="NOTES" width="360" height="202">
      </a>




      <a href="notes-class.html">
        <img src="ncert-solutions.jpg" alt="NCERT SOLUTIONS" width="360" height="202">
      </a>



</div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       const button = document.getElementById('themeButton');

button.addEventListener('click', () => {
  document.body.classList.toggle('dark-theme');
  
  if (document.body.classList.contains('dark-theme')) {
    button.textContent = 'Switch to LIGHT Mode';
  } else {
    button.textContent = 'Switch to DARK Mode';
  }
});
    </script>
    
  </body>
</html>
