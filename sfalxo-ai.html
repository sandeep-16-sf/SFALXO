<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SFALXO AI</title>

    <link rel="stylesheet" href="ai.css">

</head>

<body>

    <div class="ai-container">

        <header class="ai-header">

            <div>
                <h1>SFALXO AI</h1>
                <p>Your student assistant</p>
            </div>

        </header>


        <main id="chat-box">

            <div class="message ai-message">

                <strong>SFALXO AI</strong>

                <p>
                    Hey! 👋 I'm SFALXO AI.
                    I can help you with your studies,
                    mathematics, science, computer science
                    and more.
                </p>

            </div>

        </main>


        <div class="input-area">

            <input
                type="text"
                id="user-input"
                placeholder="Ask SFALXO AI..."
                autocomplete="off"
            >

            <button type="button" onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

<script src="./knowledge.js"></script>
    <script src="./ai.js"></script>

</body>

</html>
